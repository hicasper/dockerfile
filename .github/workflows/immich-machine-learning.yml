name: Build Immich Machine Learning Docker Image (Jetpack 5)

on:
  push:
  schedule:
    - cron: "1 19 */14 * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout repository
        uses: actions/checkout@v6

      -
        name: Get upstream version
        id: getversion
        run: |
          echo "IMMICH_VER=$(curl -sL https://api.github.com/repos/immich-app/immich/releases/latest | jq -r .tag_name)" >> $GITHUB_OUTPUT
      -
        name: Checkout immich repo
        uses: actions/checkout@v6
        with:
          repository: immich-app/immich
          path: immich
          ref: ${{ steps.getversion.outputs.IMMICH_VER }}
          sparse-checkout: machine-learning

      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          context: ./immich/machine-learning
          file: ./immich-machine-learning/Dockerfile.jetpack5
          platforms: linux/arm64
          tags: >-
            ${{ secrets.DOCKERHUB_USERNAME }}/immich-machine-learning:cuda-jetpack5,
            ${{ secrets.DOCKERHUB_USERNAME }}/immich-machine-learning:${{ steps.getversion.outputs.IMMICH_VER }}-cuda-jetpack5
          cache-from: type=gha
          cache-to: type=gha,mode=max